<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A2 Bot - Pro & Gallery</title>
  <style>
    :root {
      --bg-color: #09090b;
      --panel-bg: #18181b;
      --border-color: #27272a;
      --primary: #06b6d4;
      --primary-hover: #0891b2;
      --pro-color: #8b5cf6;
      --pro-hover: #7c3aed;
      --text-main: #e4e4e7;
      --text-muted: #a1a1aa;
      --term-green: #22c55e;
      --term-error: #ef4444;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      max-width: 1100px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Sistema de Abas */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .tab-btn {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid transparent;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      color: var(--text-main);
      background: rgba(255,255,255,0.05);
    }

    .tab-btn.active {
      background: rgba(6, 182, 212, 0.1);
      color: var(--primary);
      border-color: var(--primary);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .grid { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 24px; 
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
    }

    h1 {
      color: var(--primary);
      margin-top: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 24px;
    }

    .badge {
      background: rgba(6, 182, 212, 0.15);
      color: var(--primary);
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 16px;
      align-self: flex-start;
      letter-spacing: 0.5px;
    }

    .badge.pro {
      background: rgba(139, 92, 246, 0.15);
      color: var(--pro-color);
      border-color: rgba(139, 92, 246, 0.3);
    }

    label {
      font-size: 14px;
      font-weight: 500;
      display: block;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    textarea, select {
      width: 100%;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      color: #fff;
      font-family: inherit;
      box-sizing: border-box;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }

    textarea {
      height: 100px;
      resize: none;
      font-family: monospace;
    }

    textarea:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button.generate-btn {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: auto;
    }

    button.generate-btn:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    button.generate-btn.pro-active {
      background: var(--pro-color);
    }
    
    button.generate-btn.pro-active:hover:not(:disabled) {
      background: var(--pro-hover);
    }

    button.generate-btn:disabled {
      background: #3f3f46;
      cursor: not-allowed;
      color: #71717a;
    }

    .terminal {
      background: #000;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      font-family: monospace;
      font-size: 13px;
      height: 180px;
      overflow-y: auto;
      color: var(--term-green);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .terminal-header {
      color: #71717a;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .terminal .error { color: var(--term-error); }
    .terminal .system { color: var(--primary); }
    .terminal .pro-log { color: var(--pro-color); }

    .result-box {
      margin-top: 20px;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      min-height: 350px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #resultImage {
      max-width: 100%;
      max-height: 400px;
      border-radius: 12px;
      display: none;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
      object-fit: contain;
    }

    .btn-download {
      display: none;
      margin-top: 16px;
      background: var(--border-color);
      color: #fff;
      padding: 10px 20px;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn-download:hover {
      background: #3f3f46;
    }

    /* Galeria Styles */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .gallery-item {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s;
    }

    .gallery-item:hover {
      transform: scale(1.02);
      border-color: var(--primary);
    }

    .gallery-item img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
    }

    .gallery-item-footer {
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-color);
    }

    .gallery-prompt {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }

    .gallery-dl {
      background: var(--border-color);
      color: #fff;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
    }

    .gallery-dl:hover {
      background: var(--primary);
    }

    .empty-gallery {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 18px;
      background: var(--panel-bg);
      border-radius: 16px;
      border: 1px dashed var(--border-color);
    }

    /* Loader Animation */
    .loader {
      display: none;
      width: 48px;
      height: 48px;
      border: 4px solid var(--border-color);
      border-bottom-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    .loader.pro-loader {
      border-bottom-color: var(--pro-color);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 800px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- Sistema de Abas -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('generator', this)">🎨 Gerador</button>
      <button class="tab-btn" onclick="switchTab('gallery', this)">🖼️ Minha Galeria (<span id="galleryCount">0</span>)</button>
    </div>

    <!-- ABA 1: GERADOR -->
    <div id="generator" class="tab-content active">
      <div class="grid">
        <!-- Painel de Controles -->
        <div class="panel">
          <h1>A2 Bot ⚡</h1>
          <div id="statusBadge" class="badge">PROCESSO DESCENTRALIZADO | v3.0</div>
          
          <label for="prompt">Prompt de Geração</label>
          <textarea id="prompt" placeholder="Ex: A futuristic cyberpunk city at night, neon lights, highly detailed, 8k resolution..."></textarea>
          
          <div class="controls-grid">
            <div>
              <label for="aspectRatio">Proporção</label>
              <select id="aspectRatio">
                <option value="1024x1024">Quadrado (1:1)</option>
                <option value="1280x720">Paisagem (16:9)</option>
                <option value="720x1280">Retrato (9:16)</option>
              </select>
            </div>
            <div>
              <label for="modelSelect">Motor IA</label>
              <select id="modelSelect" onchange="updateUIForPro()">
                <option value="flux">Padrão (Flux)</option>
                <option value="turbo">Rápido (Turbo)</option>
                <option value="pro">✨ A2 Pro (Ultra HD)</option>
              </select>
            </div>
          </div>

          <button id="runBtn" class="generate-btn" onclick="runGeneration()">Iniciar Processo de Síntese</button>
        </div>
        
        <!-- Painel de Resultados e Terminal -->
        <div style="display: flex; flex-direction: column;">
          <div class="terminal">
            <div class="terminal-header">
              <span>> TERMINAL DE COMANDO</span>
              <span style="color: var(--term-green);">● ONLINE</span>
            </div>
            <div id="logs">
              <span class="system">Aguardando entrada de dados...</span>
            </div>
          </div>
          
          <div class="result-box" id="resultContainer">
            <div class="loader" id="loader"></div>
            <div id="placeholder" style="color: var(--text-muted);">A imagem gerada será renderizada aqui</div>
            <img id="resultImage" alt="Generated Output" />
            <a id="downloadBtn" class="btn-download" download="A2_Bot_Render.jpg">Baixar Imagem Atual</a>
          </div>
        </div>
      </div>
    </div>

    <!-- ABA 2: GALERIA -->
    <div id="gallery" class="tab-content">
      <div id="emptyGallery" class="empty-gallery">
        Nenhuma imagem foi gerada nesta sessão ainda.<br>
        Vá para o Gerador e crie algo incrível!
      </div>
      <div id="galleryGrid" class="gallery-grid"></div>
    </div>

  </div>

  <script>
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const logsEl = document.getElementById('logs');
    const promptEl = document.getElementById('prompt');
    const runBtn = document.getElementById('runBtn');
    const resultImage = document.getElementById('resultImage');
    const placeholder = document.getElementById('placeholder');
    const downloadBtn = document.getElementById('downloadBtn');
    const loader = document.getElementById('loader');
    
    // Arrays para armazenar as imagens da sessão
    const galleryItems = [];

    // Lógica das Abas
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    // Muda a cor da UI se "A2 Pro" for selecionado
    function updateUIForPro() {
      const isPro = document.getElementById('modelSelect').value === 'pro';
      const badge = document.getElementById('statusBadge');
      
      if (isPro) {
        runBtn.classList.add('pro-active');
        loader.classList.add('pro-loader');
        badge.classList.add('pro');
        badge.textContent = "✨ MODO A2 PRO ATIVADO";
      } else {
        runBtn.classList.remove('pro-active');
        loader.classList.remove('pro-loader');
        badge.classList.remove('pro');
        badge.textContent = "PROCESSO DESCENTRALIZADO | v3.0";
      }
    }

    function addLog(msg, type = 'normal') {
      const time = new Date().toLocaleTimeString('pt-BR', { hour12: false });
      const div = document.createElement('div');
      
      if (type === 'error') div.className = 'error';
      else if (type === 'system') div.className = 'system';
      else if (type === 'pro') div.className = 'pro-log';
      
      div.textContent = `[${time}] ${msg}`;
      logsEl.appendChild(div);
      logsEl.scrollTop = logsEl.scrollHeight;
    }

    async function runGeneration() {
      let prompt = promptEl.value.trim();
      if (!prompt) {
        addLog("ERRO: O prompt não pode estar vazio.", "error");
        promptEl.focus();
        return;
      }

      // Desabilitar UI
      const inputs = [promptEl, document.getElementById('aspectRatio'), document.getElementById('modelSelect')];
      inputs.forEach(el => el.disabled = true);
      runBtn.disabled = true;
      
      const isPro = document.getElementById('modelSelect').value === 'pro';
      runBtn.textContent = isPro ? 'Sintetizando Masterpiece...' : 'Processando Rede Neural...';
      
      // Limpar estado anterior da UI do gerador
      logsEl.innerHTML = '';
      resultImage.style.display = 'none';
      downloadBtn.style.display = 'none';
      placeholder.style.display = 'none';
      loader.style.display = 'block';

      // Configurações base
      const [width, height] = document.getElementById('aspectRatio').value.split('x');
      let model = document.getElementById('modelSelect').value;
      const seed = Math.floor(Math.random() * 999999999);
      let enhance = "false";

      addLog("Inicializando A2 Bot Core...", "system");
      
      // Lógica do Modo Pro
      if (isPro) {
        await sleep(300);
        addLog("ATENÇÃO: Roteando para servidores A2 Pro.", "pro");
        addLog("Injetando parâmetros de Engenharia de Prompt (8K, Fotorealismo)...", "pro");
        model = "flux"; // Pro usa Flux sob o capô
        enhance = "true"; // Ativa o LLM no servidor para melhorar o prompt
        prompt = prompt + ", masterpiece, best quality, ultra detailed, cinematic lighting, 8k resolution, award-winning photography"; // Injeção secreta
      }

      await sleep(400);
      addLog(`Parâmetros: [${width}x${height}] | Motor [${isPro ? 'A2 PRO' : model.toUpperCase()}]`);
      addLog("Estabelecendo conexão...");
      
      try {
        const encPrompt = encodeURIComponent(prompt);
        // Construção da URL
        const apiUrl = `https://image.pollinations.ai/prompt/${encPrompt}?width=${width}&height=${height}&nologo=true&model=${model}&seed=${seed}&enhance=${enhance}`;
        
        addLog("Enviando tensores para síntese visual (Aguarde)...");
        
        const fetchResp = await fetch(apiUrl);
        
        if (!fetchResp.ok) throw new Error(`Falha no nó de processamento (Status: ${fetchResp.status})`);
        
        // Criar Blob local (não será apagado para manter a galeria funcionando)
        const blob = await fetchResp.blob();
        const objectUrl = URL.createObjectURL(blob);
        
        addLog("Decodificação concluída. Aplicando filtros finais...", "system");
        await sleep(300);
        addLog("Renderização finalizada com sucesso!", "system");
        
        // Atualizar UI do Gerador
        resultImage.src = objectUrl;
        downloadBtn.href = objectUrl;
        loader.style.display = 'none';
        resultImage.style.display = 'block';
        downloadBtn.style.display = 'inline-block';

        // Salvar na Galeria
        saveToGallery(objectUrl, promptEl.value.trim(), isPro);
        
      } catch (err) {
        loader.style.display = 'none';
        placeholder.style.display = 'block';
        placeholder.textContent = "Falha na geração.";
        addLog(`ERRO CRÍTICO: ${err.message}`, "error");
      } finally {
        // Restaurar UI
        inputs.forEach(el => el.disabled = false);
        runBtn.disabled = false;
        runBtn.textContent = 'Iniciar Processo de Síntese';
      }
    }

    function saveToGallery(url, originalPrompt, isPro) {
      // Cria objeto e insere no início do array
      galleryItems.unshift({ url, prompt: originalPrompt, isPro });
      
      // Atualiza contador na aba
      document.getElementById('galleryCount').textContent = galleryItems.length;
      
      // Esconde mensagem de "galeria vazia"
      document.getElementById('emptyGallery').style.display = 'none';
      
      // Atualiza interface da Galeria
      renderGallery();
    }

    function renderGallery() {
      const grid = document.getElementById('galleryGrid');
      grid.innerHTML = ''; // Limpa atual

      galleryItems.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'gallery-item';
        
        // Tag pro visual
        const proTag = item.isPro ? `<span style="position:absolute; top:8px; right:8px; background:var(--pro-color); color:#fff; font-size:10px; padding:4px 8px; border-radius:4px; font-weight:bold;">A2 PRO</span>` : '';

        div.innerHTML = `
          <div style="position:relative;">
            <img src="${item.url}" alt="Imagem Gerada">
            ${proTag}
          </div>
          <div class="gallery-item-footer">
            <div class="gallery-prompt" title="${item.prompt}">${item.prompt}</div>
            <a href="${item.url}" class="gallery-dl" download="A2_Gallery_${index}.jpg">⬇️</a>
          </div>
        `;
        grid.appendChild(div);
      });
    }
  </script>
</body>
</html>
